# Publishes @waynew8623/n8n-nodes-pollinations to npm on every version tag push.
#
# n8n requires community nodes to be published through GitHub Actions with an
# npm provenance statement. Provenance lets anyone cryptographically verify that
# a package was built by this exact workflow, from this exact repository/commit.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# Option A — OIDC Trusted Publishing (recommended, no long-lived secrets):
#   1. Log in to npmjs.com and open the package settings for
#      @waynew8623/n8n-nodes-pollinations.
#   2. Under "Publish access" → "Trusted Publishers", add a publisher:
#        Repository owner: waynew8623
#        Repository name:  n8n-nodes-pollinations
#        Workflow name:    publish.yml
#        Environment:      (leave blank unless you use GitHub Environments)
#   3. Leave the NPM_TOKEN secret unset — GitHub's OIDC token is used instead.
#
# Option B — npm token (fallback):
#   1. On npmjs.com: Access Tokens → Generate New Token → Granular Access Token
#      scoped to this package with "Read and write" publish permission.
#   2. In GitHub: Settings → Secrets and variables → Actions → New secret,
#      name it NPM_TOKEN and paste the token value.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# Triggers on tags matching "*.*.*" (e.g. 0.2.0).
# For a "v" prefix (e.g. v0.2.0), change the filter to: tags: ['v*.*.*']
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
#   npm run release
#
# Lints, builds, prompts for a version bump, updates the changelog, commits,
# tags and pushes — which triggers this workflow to publish to npm.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for the npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        # Publishes to npm with a provenance attestation (needs id-token: write).
        # Lint and build run automatically as part of the release process.
        #
        # Option A (OIDC): leave NPM_TOKEN unset — npm uses the OIDC exchange.
        # Option B (token): set NPM_TOKEN in repo secrets — written to .npmrc here.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
